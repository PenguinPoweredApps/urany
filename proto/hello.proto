syntax = "proto3";

package helloworld;

// Update this to match your actual Go module path
option go_package = "example.com/helloworld/pb";

// The greeting service definition.
service Greeter {
  // A standard Unary RPC method.
  rpc SayHello (HelloRequest) returns (HelloReply) {}
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}